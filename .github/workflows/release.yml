name: Promote verified release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: datamesh-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a successful main candidate for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/promote_production.py
        # Promotion downloads the verified artifact and retags existing digests;
        # it does not run an image or frontend build.
